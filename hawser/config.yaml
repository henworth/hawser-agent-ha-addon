name: Hawser Agent
slug: hawser
version: "1.2.0-rc1"
description: Hawser agent for Dockhand (Edge mode)

arch:
  - amd64
  - aarch64

startup: services
boot: auto
docker_api: true
full_access: true

privileged:
  - SYS_ADMIN

host_network: false
ports:
  2376/tcp: 2376

options:
  dockhand_server_url: ""
  token: ""

schema:
  dockhand_server_url: str
  token: password
